name: Deploy participant portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pin the runner image so scheduled GitHub migrations don't change the
    # build environment without a reviewed workflow update.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Pin Actions to verified upstream release commits. Dependabot keeps these
      # pins current through reviewable pull requests.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: npm ci
      - run: npm test
      # First deployment is a static preview only. It has no API origin and
      # cannot accept participants or save study data.
      - name: Build static preview
        run: npm run build:pages
        env:
          VITE_BASE_PATH: /trust-game-portal/
          VITE_PREVIEW_ONLY: "true"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-pages
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
